<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yureka - Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            font-family: 'VT323', monospace;
        }
        body {
            font-family: 'VT323', monospace;
            background: #000;
            color: #DCFF9A;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: #1a1a1a;
            border: 2px solid #7BB45E;
            border-radius: 10px;
            padding: 30px;
        }
        h1 {
            color: #DCFF9A;
            margin-bottom: 20px;
        }
        .email-display {
            color: #999;
            margin-bottom: 20px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #2a2a2a;
            border: 2px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: #E6E3A9;
            border: 3px solid #99A465;
            border-radius: 12px;
            color: #000;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #d4d197;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .error {
            color: #FF4444;
            margin: 10px 0;
        }
        .success {
            color: #4CAF50;
            margin: 10px 0;
        }
        .loading {
            text-align: center;
            padding: 40px 0;
            color: #7BB45E;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loadingMessage" class="loading">
            <h2>Loading...</h2>
            <p>Verifying your reset link...</p>
        </div>

        <div id="resetContainer" style="display: none;">
            <h1>Reset Your Password</h1>
            <div id="emailDisplay" class="email-display"></div>
            
            <div id="resetForm">
                <input 
                    type="password" 
                    id="newPassword" 
                    placeholder="New Password (min 6 characters)"
                    minlength="6"
                />
                <input 
                    type="password" 
                    id="confirmPassword" 
                    placeholder="Confirm New Password"
                />
                <div id="errorMessage" class="error"></div>
                <button onclick="handleResetPassword()" id="resetButton">
                    Reset Password
                </button>
            </div>

            <div id="successMessage" style="display: none;">
                <div class="success">
                    <h2>✅ Password Reset Successful!</h2>
                    <p>You can now log in to Yureka with your new password.</p>
                    <p>You can close this window and return to the app.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Supabase client
        const supabaseUrl = 'https://auadwsffujnatsokygwf.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF1YWR3c2ZmdWpuYXRzb2t5Z3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQwNTAzNTQsImV4cCI6MjA2OTYyNjM1NH0.tHDEN3ZJ3O4hgHkip0MRIdhO1PPtQxa_mKs4SBmJqag';
        
        // Initialize with PKCE disabled for this web context
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey, {
            auth: {
                flowType: 'implicit',
                detectSessionInUrl: true
            }
        });

        let userEmail = '';

        // Initialize reset flow
        async function initializeResetFlow() {
            console.log('Initializing reset flow...');
            
            try {
                // Let Supabase automatically detect and handle the recovery session
                // This happens during client initialization with detectSessionInUrl: true
                
                // Wait a bit for Supabase to process the URL
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Get the current session
                const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
                
                console.log('Session check:', session ? 'Session found' : 'No session', sessionError);
                
                // Hide loading
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('resetContainer').style.display = 'block';
                
                if (sessionError) {
                    console.error('Session error:', sessionError);
                    document.getElementById('errorMessage').textContent = 
                        'Invalid or expired reset link. Please request a new one.';
                    document.getElementById('resetButton').disabled = true;
                    return;
                }
                
                if (!session) {
                    // Try to get user another way
                    const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
                    
                    if (!user) {
                        document.getElementById('errorMessage').textContent = 
                            'Invalid or expired reset link. Please request a new one.';
                        document.getElementById('resetButton').disabled = true;
                        return;
                    }
                    
                    userEmail = user.email || '';
                } else {
                    userEmail = session.user?.email || '';
                }
                
                // Display user email
                if (userEmail) {
                    document.getElementById('emailDisplay').textContent = 
                        `Resetting password for: ${userEmail}`;
                    console.log('Ready to reset password for:', userEmail);
                } else {
                    document.getElementById('errorMessage').textContent = 
                        'Unable to verify user. Please request a new reset link.';
                    document.getElementById('resetButton').disabled = true;
                }
                
            } catch (err) {
                console.error('Initialization error:', err);
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('resetContainer').style.display = 'block';
                document.getElementById('errorMessage').textContent = 
                    'An error occurred. Please request a new reset link.';
                document.getElementById('resetButton').disabled = true;
            }
        }

        // Handle password reset
        async function handleResetPassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('errorMessage');
            const button = document.getElementById('resetButton');

            // Clear previous errors
            errorDiv.textContent = '';

            // Validation
            if (!newPassword || !confirmPassword) {
                errorDiv.textContent = 'Please fill in both password fields';
                return;
            }

            if (newPassword.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters';
                return;
            }

            if (newPassword !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                return;
            }

            // Disable button and show loading
            button.disabled = true;
            button.textContent = 'Resetting...';

            try {
                // Update password
                const { data, error } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) {
                    console.error('Password update error:', error);
                    errorDiv.textContent = error.message || 'Failed to reset password';
                    button.disabled = false;
                    button.textContent = 'Reset Password';
                    return;
                }

                console.log('Password updated successfully');

                // Success!
                document.getElementById('resetForm').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';

                // Sign out after successful reset
                setTimeout(async () => {
                    await supabaseClient.auth.signOut();
                    console.log('Signed out after password reset');
                }, 2000);

            } catch (err) {
                console.error('Reset error:', err);
                errorDiv.textContent = 'An error occurred. Please try again.';
                button.disabled = false;
                button.textContent = 'Reset Password';
            }
        }

        // Listen for auth state changes
        supabaseClient.auth.onAuthStateChange((event, session) => {
            console.log('Auth event:', event);
            if (event === 'PASSWORD_RECOVERY') {
                console.log('Password recovery session detected');
                // Session is ready for password reset
                if (session?.user?.email) {
                    userEmail = session.user.email;
                    document.getElementById('emailDisplay').textContent = 
                        `Resetting password for: ${userEmail}`;
                }
            }
        });

        // Initialize on page load
        window.addEventListener('load', () => {
            // Give Supabase time to process the URL parameters
            setTimeout(initializeResetFlow, 100);
        });
    </script>
</body>
</html>
